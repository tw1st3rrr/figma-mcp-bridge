<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 12px/1.4 Inter, system-ui, sans-serif; margin: 0; padding: 12px; color: #222; background: #fff; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  input { width: 70px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
  button { padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; font: inherit; cursor: pointer; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c00; display: inline-block; }
  .dot.on { background: #18a058; }
  .dot.wait { background: #e8a317; }
  #log { height: 84px; overflow: auto; background: #f7f7f7; border: 1px solid #e5e5e5; border-radius: 4px; padding: 6px; font-family: ui-monospace, Consolas, monospace; font-size: 11px; white-space: pre-wrap; }
  .muted { color: #777; }
</style>
</head>
<body>
  <div class="row">
    <span id="dot" class="dot"></span>
    <strong id="status">disconnected</strong>
    <span class="muted">port</span>
    <input id="port" type="number" value="3055">
    <button id="btn">Connect</button>
  </div>
  <div class="row muted" id="info">Keep this window open. Claude Code talks to Figma through it.</div>
  <div id="log"></div>
<script>
  var ws = null, wantOpen = true, backoff = 1000, timer = null, count = 0;
  var $ = function (id) { return document.getElementById(id); };
  function log(s) { var el = $('log'); el.textContent += s + '\n'; el.scrollTop = el.scrollHeight; }
  function setStatus(text, cls) { $('status').textContent = text; $('dot').className = 'dot ' + (cls || ''); }
  function toMain(msg) { parent.postMessage({ pluginMessage: msg }, '*'); }

  function connect() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
    var url = 'ws://localhost:' + ($('port').value || 3055) + '/plugin';
    setStatus('connecting…', 'wait');
    try { ws = new WebSocket(url); } catch (e) { log('WebSocket error: ' + e); schedule(); return; }
    ws.onopen = function () { backoff = 1000; setStatus('connected', 'on'); log('connected ' + url); toMain({ type: 'ws-open' }); };
    ws.onmessage = function (ev) {
      var msg; try { msg = JSON.parse(ev.data); } catch (e) { log('bad json'); return; }
      if (msg && msg.type === 'cmd') { count++; $('info').textContent = 'commands: ' + count + ' · last: ' + msg.cmd; }
      toMain(msg);
    };
    ws.onclose = function (ev) { ws = null; log('closed code=' + ev.code + (ev.reason ? ' ' + ev.reason : '')); setStatus('disconnected', ''); if (wantOpen) schedule(); };
    ws.onerror = function () { /* onclose follows */ };
  }
  function schedule() { setStatus('reconnecting in ' + Math.round(backoff / 1000) + 's', 'wait'); timer = setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 10000); }

  $('btn').onclick = function () {
    if (ws) { wantOpen = false; ws.close(); $('btn').textContent = 'Connect'; }
    else { wantOpen = true; backoff = 1000; connect(); $('btn').textContent = 'Disconnect'; }
  };
  window.onmessage = function (ev) {
    var m = ev.data && ev.data.pluginMessage;
    if (!m) return;
    if (m.type === 'send') {
      if (ws && ws.readyState === 1) ws.send(JSON.stringify(m.payload));
      else log('dropped (not connected): ' + (m.payload && m.payload.type));
    } else if (m.type === 'log') log(String(m.text));
  };
  // App-level keepalive: the bridge treats any frame as proof of life.
  setInterval(function () { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'ping', t: Date.now() })); }, 15000);
  $('btn').textContent = 'Disconnect';
  connect();
</script>
</body>
</html>
